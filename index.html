<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu Style</title>
        <link rel="stylesheet" href="menustyle.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    </head>
    <body>
        <div class="PURI">
            <h1>This is personal project</h1>
        </div>
        <div class="PURA">
           <div class="toggle">
            <i class="fa-solid fa-share-nodes"></i>
           </div> 
           <li style="--i:0;--clr:#1877f2"><i class="fa-brands fa-square-facebook"></i></li>
           <li style="--i:1;--clr:#25d366"><i class="fa-brands fa-linkedin-in"></i></li>
           <li style="--i:2;--clr:#1da1f2"><i class="fa-brands fa-whatsapp"></i></li>
           <li style="--i:3;--clr:#FF5733"><i class="fa-brands fa-twitter"></i></li>
           <li style="--i:4;--clr:#0a66c2"><i class="fa-brands fa-reddit"></i></li>
           <li style="--i:5;--clr:#c32aa3"><i class="fa-brands fa-github"></i></li>
           <li style="--i:6;--clr:#1b1e21"><i class="fa-brands fa-instagram"></i></li>
           <li style="--i:7;--clr:#ff0000"><i class="fa-brands fa-youtube"></i></li>
          
        </div>
         <script src="java.js"></script>
        <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js'></script>
        <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js'></script><script  src="java.js"></script>

    </body>

</html>
